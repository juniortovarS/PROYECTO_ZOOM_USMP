name: CI/CD Pipeline - Zoom USMP Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validar Sintaxis de Python
        run: |
          python -m py_compile main.py

      - name: Compilar Imagen Docker (Prueba de Build)
        run: |
          docker build -t zoom-usmp-app:latest .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Despliegue Automático vía SSH al Servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/PROYECTO_ZOOM_USMP || git clone https://github.com/juniortovarS/PROYECTO_ZOOM_USMP.git /opt/PROYECTO_ZOOM_USMP
            cd /opt/PROYECTO_ZOOM_USMP
            git pull origin main
            docker compose up -d --build
