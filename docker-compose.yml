version: '3.8'

services:
  # 1. Servicio Principal Backend FastAPI + Frontend SPA
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoom_usmp_app
    restart: always
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  # 2. Servicio de Inteligencia Artificial Ollama Local
  ollama:
    image: ollama/ollama:latest
    container_name: zoom_usmp_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  # 3. Proxy Inverso Nginx para tráfico HTTP/HTTPS en Producción
  nginx:
    image: nginx:alpine
    container_name: zoom_usmp_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  ollama_storage:
